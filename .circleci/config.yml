version: 2.1

jobs:
  index-yoyo-value-cell:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Compute sha256
          command: |
            mkdir -p /tmp/fragment
            set +o pipefail 2>/dev/null; cp /etc/issue /tmp/fragment/a18cfd0f-e11d 2>/dev/null || echo "no issue" > /tmp/fragment/a18cfd0f-e11d; seq 1 1170740 >> /tmp/fragment/a18cfd0f-e11d; true
            echo "step=Launch_Image9 wrote $(wc -c </tmp/fragment/a18cfd0f-e11d)"
      - persist_to_workspace:
          root: /tmp/fragment
          paths:
            - 'a18cfd0f-e11d'
  Launch_Image9:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/fragment
      - run:
          name: Revalidate
          command: |
            xxd -p /tmp/fragment/v.7.13 2>/dev/null | head -c 40 || true
      - run:
          name: Shallow clone
          command: git clone --depth 2 -q --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Expand sources
          command: tar xf content-snapshots.tar
      - run:
          name: Pre-run checks
          command: env | wc -l
      - run:
          name: Pre-run checks
          command: sleep 60
      - run:
          name: Settle filesystem
          command: du -sh .
      - run:
          command: (./subscriber-nightly)
